name: "Build and Publish ECMIS Skill Zip"

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write     # create the release and upload its asset

concurrency:
  group: release-zip-${{ github.ref }}
  cancel-in-progress: false     # never cancel a release — a killed run leaves a tag with no asset

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        # v1.2.3 -> 1.2.3; the zip and VERSION file carry the bare number
        run: echo "ECMIS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build zip
        run: bash packaging/build-ecmis-zip.sh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: dist/ecmis-skill-${{ env.ECMIS_VERSION }}.zip
        run: |
          # Re-running the workflow for an existing tag replaces the asset instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            PRERELEASE=""
            [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE="--prerelease"
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "ECMIS skill $ECMIS_VERSION" \
              --generate-notes $PRERELEASE
          fi

      - name: Job summary
        run: |
          {
            echo "### Release published"
            echo
            echo "**Version:** \`${ECMIS_VERSION}\`"
            echo "**Asset:** \`ecmis-skill-${ECMIS_VERSION}.zip\`"
            echo "**Page:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
